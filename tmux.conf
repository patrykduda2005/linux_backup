set -g mouse 1
bind-key -r f run-shell "tmux neww $USER_SCRIPTS/tmux-sessionizer" 
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key M-0 join-pane -h -s :0
bind-key M-1 join-pane -h -s :1
bind-key M-2 join-pane -h -s :2
bind-key M-3 join-pane -h -s :3
bind-key M-4 join-pane -h -s :4
bind-key M-5 join-pane -h -s :5
bind-key M-6 join-pane -h -s :6
bind-key M-7 join-pane -h -s :7
bind-key M-8 join-pane -h -s :8
bind-key M-9 join-pane -h -s :9

bind-key b break-pane -d
